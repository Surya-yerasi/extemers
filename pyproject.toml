[project]
name = "calculator"
version = "0.1.0"
description = "Calculator Lambda behind API Gateway - reference template for AWS serverless services"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculator"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S113"]
"scripts/**" = ["S104"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: hits a deployed API (requires API_URL)"]

[tool.coverage.run]
source = ["calculator"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
