[project]
name = "docqa"
version = "0.1.0"
description = "Personal-document Q&A (RAG) lab on Amazon Bedrock"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools>=3.0",
    "boto3>=1.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lancedb>=0.39.0",
    "langgraph>=1.2.14",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "boto3-stubs[ssm]>=1.40",
    "botocore[crt]>=1.43.108",
    "langchain-community==0.4.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ragas>=0.4.3",
    "reportlab>=5.0.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyarrow", "pyarrow.*", "pypdfium2", "pypdfium2.*", "lancedb.*", "reportlab.*", "ragas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["docqa"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
