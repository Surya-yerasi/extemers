repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: docqa-ruff
        name: docqa ruff
        entry: uv run --directory services/docqa ruff check --fix
        language: system
        files: ^services/docqa/.*\.py$
        pass_filenames: false
      - id: docqa-ruff-format
        name: docqa ruff format
        entry: uv run --directory services/docqa ruff format
        language: system
        files: ^services/docqa/.*\.py$
        pass_filenames: false
      - id: docqa-mypy
        name: docqa mypy
        entry: uv run --directory services/docqa mypy src tests
        language: system
        files: ^services/docqa/.*\.py$
        pass_filenames: false
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive infra
        language: system
        files: \.tf$
        pass_filenames: false
