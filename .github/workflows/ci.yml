name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.x"   # keep in step with local Terraform

jobs:
  docqa:
    name: docqa lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/docqa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/docqa/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest --cov --cov-report=term-missing

  docqa-image:
    name: docqa image build (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      # Build only; Deploy pushes. provenance/sbom off: Lambda rejects images with attestations.
      - uses: docker/build-push-action@v6
        with:
          context: services/docqa
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: false
          cache-from: type=gha,scope=docqa
          cache-to: type=gha,mode=max,scope=docqa

  terraform-static:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make tf-fmt
      - run: make tf-validate

  terraform-plan:
    name: Terraform plan (dev)
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [terraform-static, docqa, docqa-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC → AWS
      pull-requests: write   # comment the plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: terraform init
        working-directory: infra/envs/dev
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: terraform plan
        id: plan
        working-directory: infra/envs/dev
        env:
          TF_VAR_image_tag: ${{ github.event.pull_request.head.sha }}
          TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
        run: terraform plan -input=false -no-color -lock=false | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/dev/plan.txt', 'utf8').slice(-60000);
            const body = `### Terraform plan — dev\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
